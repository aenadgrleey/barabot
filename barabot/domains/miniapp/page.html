<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Barabot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --page: var(--tg-theme-secondary-bg-color, #efeff4);
    --section: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --subtitle: var(--tg-theme-subtitle-text-color, var(--tg-theme-hint-color, #8e8e93));
    --link: var(--tg-theme-link-color, #007aff);
    --accent: var(--tg-theme-accent-text-color, var(--tg-theme-link-color, #007aff));
    --button: var(--tg-theme-button-color, #007aff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --header: var(--tg-theme-section-header-text-color, #6d6d72);
    --separator: var(--tg-theme-section-separator-color, rgba(60, 60, 67, 0.29));
    --danger: var(--tg-theme-destructive-text-color, #ff3b30);

    --radius: 10px;
    --gutter: 16px;
    --body-size: 17px;
    --topbar: 44px;
    --bar-button: 50px;
    --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
    --safe-left: max(var(--tg-safe-area-inset-left, 0px), env(safe-area-inset-left, 0px));
    --safe-right: max(var(--tg-safe-area-inset-right, 0px), env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--page); }
  body {
    margin: 0;
    min-height: var(--tg-viewport-height, 100vh);
    padding: calc(var(--safe-top) + 8px) calc(var(--safe-right) + var(--gutter))
             calc(var(--safe-bottom) + var(--bar-button) + 44px) calc(var(--safe-left) + var(--gutter));
    background: var(--page);
    color: var(--text);
    font: 400 var(--body-size)/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", "Segoe UI",
          "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
    overflow-wrap: anywhere;
  }
  svg { display: block; }

  /* Hero: icon, title and a short explanation, centred like Telegram's own settings pages. */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center;
          padding: 8px 12px 20px; }
  .hero-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
               margin-bottom: 12px; color: #fff; background: var(--button);
               background: linear-gradient(160deg, color-mix(in srgb, var(--button) 62%, #ffffff), var(--button)); }
  .hero-icon svg { width: 32px; height: 32px; }
  .hero h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.2px; }
  .hero p { margin: 0; max-width: 280px; font-size: 15px; line-height: 1.33; color: var(--hint); }
  .hero.quiet .hero-icon { color: var(--hint); background: var(--section); }
  /* A collapsing hero: its box goes away so the title can stick to the top bar for the whole page.
     The browser keeps the title in place while scrolling; collapse() only scales and fades. */
  .hero.collapsing { display: contents; }
  .hero.collapsing .hero-icon { margin: 8px auto 12px; will-change: transform, opacity; }
  .hero.collapsing h1 { position: sticky; z-index: 11; margin: 0 12px 6px; text-align: center; white-space: nowrap;
                        transform-origin: 50% 0; will-change: transform; }
  .hero.collapsing p { margin: 0 auto 20px; padding: 0 12px; text-align: center; will-change: opacity; }
  .topbar { position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: calc(var(--safe-top) + var(--topbar));
            opacity: 0; pointer-events: none; }
  .topbar::before { content: ""; position: absolute; inset: 0 0 -28px 0;
                    background: linear-gradient(to bottom, var(--page) calc(100% - 28px),
                                                color-mix(in srgb, var(--page) 60%, transparent) calc(100% - 16px),
                                                transparent); }

  /* The add button floats over the list; the list fades out under it. */
  .bottombar { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0;
               padding: 24px calc(var(--safe-right) + var(--gutter)) calc(var(--safe-bottom) + 12px)
                        calc(var(--safe-left) + var(--gutter));
               background: linear-gradient(to bottom, transparent,
                                           color-mix(in srgb, var(--page) 55%, transparent)); }
  .bottombar button { display: block; width: 100%; height: var(--bar-button); border: 0; border-radius: 12px;
                      background: var(--button); color: var(--button-text); cursor: pointer;
                      font: 600 var(--body-size)/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto",
                            "Segoe UI", "Helvetica Neue", sans-serif; }
  .bottombar button:active { opacity: 0.8; }
  .centered { min-height: calc(var(--tg-viewport-stable-height, 100vh) - var(--safe-top) - 160px);
              display: flex; flex-direction: column; justify-content: center; }

  /* Sections */
  .section-header { margin: 0 var(--gutter) 7px; font-size: 13px; line-height: 1.3; text-transform: uppercase;
                    color: var(--header); letter-spacing: 0.1px; }
  .section { background: var(--section); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
  .section + .section-footer { margin-top: -13px; }
  .section-footer { margin: 0 var(--gutter) 20px; font-size: 13px; line-height: 1.38; color: var(--hint); }
  .row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px;
         padding: 11px var(--gutter); }
  .row + .row::before, .details + .row::before {
    content: ""; position: absolute; top: 0; right: 0; left: var(--inset, var(--gutter));
    border-top: 0.5px solid var(--separator);
  }
  .row.chat { --inset: 68px; padding-top: 8px; padding-bottom: 8px; min-height: 60px; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 16px; line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical;
               -webkit-line-clamp: 2; overflow: hidden; }
  .row.chat.in-folder { --inset: 108px; padding-left: calc(var(--gutter) + 40px); }
  .row.chat .row-title { font-weight: 400; display: block; white-space: nowrap; text-overflow: ellipsis; }
  .row-subtitle { margin-top: 2px; font-size: 14px; line-height: 1.3; color: var(--subtitle);
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-subtitle .joined { color: var(--accent); }
  .row-subtitle .failed { color: var(--danger); }

  /* Header of a subscription: what it looks for, above the chats it reads. */
  .details { display: flex; gap: 12px; align-items: flex-start; padding: 12px var(--gutter) 14px; }
  .details + .row::before { left: var(--gutter); }
  .details-main { flex: 1; min-width: 0; }
  .kind { font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--accent); margin-bottom: 2px; }
  .query { font-size: var(--body-size); line-height: 1.3; font-weight: 600; letter-spacing: -0.2px; }
  .facts { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px;
           background: color-mix(in srgb, var(--text) 5%, transparent);
           display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 4px;
           font-size: 15px; line-height: 1.33; }
  .facts dt { color: var(--hint); }
  .facts dd { margin: 0; min-width: 0; }

  /* Chat avatars use Telegram's peer colours. */
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
            color: #fff; font-size: 17px; font-weight: 600; text-transform: uppercase;
            background: linear-gradient(180deg, var(--a1), var(--a2)); }
  .avatar svg { width: 22px; height: 22px; }
  .avatar.folder { background: color-mix(in srgb, var(--hint) 60%, transparent); }
  .avatar { position: relative; overflow: hidden; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
                opacity: 0; transition: opacity 0.2s; }
  .avatar img.loaded { opacity: 1; }

  /* Bot blocked */
  .alert .row { align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
  .alert .row-title { font-weight: 600; -webkit-line-clamp: unset; }
  .alert .row-subtitle { white-space: normal; font-size: 15px; line-height: 1.33; color: var(--hint); }
  .alert-icon { flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
                color: #fff; background: var(--danger); margin-top: 1px; }
  .alert-icon svg { width: 18px; height: 18px; }
  .action { color: var(--link); text-decoration: none; cursor: pointer; --inset: 58px; padding-left: 58px;
            align-items: center; min-height: 44px; }
  .action .row-main { font-size: var(--body-size); }
  .chevron { flex: none; color: color-mix(in srgb, var(--hint) 70%, transparent); }
  .chevron svg { width: 8px; height: 13px; }
  .action:active, .action.pressed { background: color-mix(in srgb, var(--text) 8%, transparent); }
  a.row.chat { color: inherit; text-decoration: none; cursor: pointer; }
  a.row.chat:active { background: color-mix(in srgb, var(--text) 8%, transparent); }

  /* Loading and errors */
  .state { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           text-align: center; padding: 24px; color: var(--hint); font-size: 15px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--separator);
             border-top-color: var(--hint); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Android Telegram draws full-width sections with accent-coloured headers. */
  .android { --radius: 0px; --body-size: 16px; --topbar: 56px; --bar-button: 48px; }
  .android .bottombar button { border-radius: 8px; }
  .android body { padding-left: var(--safe-left); padding-right: var(--safe-right); }
  .android .section-header { margin-top: 0; font-size: 15px; font-weight: 500; text-transform: none;
                             color: var(--accent); margin-bottom: 0; padding: 12px var(--gutter) 4px;
                             background: var(--section); }
  .android .section-header + .section { margin-top: 0; }
  .android .section { margin-bottom: 12px; }
  .android .section-footer { margin-top: -12px; padding: 8px var(--gutter) 12px; }
</style>
</head>
<body>
<div id="root"><div class="state"><div class="spinner"></div></div></div>
<script>
const STATUS = {
  pending: "joining soon",
  joined: "watching",
  requested: "waiting for admin approval",
  failed: "cannot join",
  expanded: "folder",
};

// Telegram's peer avatar gradients.
const AVATAR_COLORS = [
  ["#ff885e", "#ff516a"], ["#ffcd6a", "#ffa85c"], ["#82b1ff", "#665fff"], ["#a0de7e", "#54cb68"],
  ["#53edd6", "#28c9b7"], ["#72d5fd", "#2a9ef1"], ["#e0a2f3", "#d669ed"],
];

const SVG_NS = "http://www.w3.org/2000/svg";
const ICONS = {
  alert: "M12 3.5a1.6 1.6 0 0 1 1.6 1.6v8.3a1.6 1.6 0 0 1-3.2 0V5.1A1.6 1.6 0 0 1 12 3.5Zm0 13.2a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8Z",
  folder: "M4 5h5.2l2 2H20a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 4 5Z",
  link: "M10.6 13.4a1 1 0 0 1 0-1.4l3-3a1 1 0 1 1 1.4 1.4l-3 3a1 1 0 0 1-1.4 0Zm-1.8-3.6a1 1 0 0 1 0 1.4l-2.1 2.1a2.5 2.5 0 0 0 3.5 3.5l2.1-2.1a1 1 0 1 1 1.4 1.4l-2.1 2.1a4.5 4.5 0 0 1-6.3-6.3l2.1-2.1a1 1 0 0 1 1.4 0Zm6.4 4.4a1 1 0 0 1 0-1.4l2.1-2.1a2.5 2.5 0 0 0-3.5-3.5l-2.1 2.1a1 1 0 1 1-1.4-1.4l2.1-2.1a4.5 4.5 0 0 1 6.3 6.3l-2.1 2.1a1 1 0 0 1-1.4 0Z",
  bell: "M12 2.5a6 6 0 0 1 6 6v3.6l1.6 3.1A1 1 0 0 1 18.7 17H5.3a1 1 0 0 1-.9-1.8L6 12.1V8.5a6 6 0 0 1 6-6Zm-2.6 15.5h5.2a2.6 2.6 0 0 1-5.2 0Z",
  inbox: "M5.4 4h13.2a2 2 0 0 1 1.9 1.4l2 6.6c.1.2.1.4.1.6V18a2 2 0 0 1-2 2H3.4a2 2 0 0 1-2-2v-5.4c0-.2 0-.4.1-.6l2-6.6A2 2 0 0 1 5.4 4Zm0 2-1.8 6H8a1 1 0 0 1 1 1 3 3 0 0 0 6 0 1 1 0 0 1 1-1h4.4l-1.8-6H5.4Z",
  chevron: "M1.3 1.3a1 1 0 0 1 1.4 0l5 5a1 1 0 0 1 0 1.4l-5 5a1 1 0 1 1-1.4-1.4L5.6 7 1.3 2.7a1 1 0 0 1 0-1.4Z",
};

let tg = null;

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs || {});
  for (const child of children) if (child != null) node.append(child);
  return node;
}

function icon(name, size) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", name === "chevron" ? "0 0 8.7 14" : "0 0 24 24");
  svg.setAttribute("fill", "currentColor");
  svg.setAttribute("aria-hidden", "true");
  if (size) { svg.setAttribute("width", size); svg.setAttribute("height", size); }
  const path = document.createElementNS(SVG_NS, "path");
  path.setAttribute("d", ICONS[name]);
  svg.append(path);
  return svg;
}

function haptic(kind) {
  try {
    const h = tg && tg.HapticFeedback;
    if (!h) return;
    if (kind === "select") h.selectionChanged();
    else h.impactOccurred(kind || "light");
  } catch (e) { /* older clients have no haptics */ }
}

function isLink(chat) {
  return /^(https?:\/\/|t\.me\/)/i.test(chat);
}

// A bare marked ID such as -1001234567890 means nothing to a person, so the page never shows it.
function isId(chat) {
  return /^-?\d+$/.test(chat);
}

// The joiner looks the username up; until then a chat added as @name already has one.
function username(chat) {
  if (chat.username) return "@" + chat.username;
  return chat.chat.startsWith("@") ? chat.chat : null;
}

// Title first, then @username; "https://t.me/+AbCdEf" becomes "t.me/+AbCdEf".
function chatName(chat) {
  if (chat.title) return chat.title;
  if (username(chat)) return username(chat);
  if (isId(chat.chat)) return "Unnamed chat";
  return chat.chat.replace(/^https?:\/\//i, "");
}

// Photos need the initData header, so an <img> cannot fetch them itself. One fetch per photo,
// shared by every row that shows the same chat.
const photos = new Map();

function photoUrl(path) {
  if (!photos.has(path)) {
    photos.set(path, fetch(path, { headers: { Authorization: "tma " + tg.initData } })
      .then((response) => (response.ok ? response.blob() : null))
      .then((blob) => (blob ? URL.createObjectURL(blob) : null))
      .catch(() => null));
  }
  return photos.get(path);
}

function avatar(chat) {
  let hash = 0;
  for (const ch of chat.chat) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
  const [a1, a2] = AVATAR_COLORS[hash % AVATAR_COLORS.length];
  const node = el("div", { className: "avatar" + (chat.status === "expanded" ? " folder" : "") });
  node.style.setProperty("--a1", a1);
  node.style.setProperty("--a2", a2);
  if (chat.status === "expanded") node.append(icon("folder"));
  else if (!chat.title && !chat.username && isLink(chat.chat)) node.append(icon("link"));
  else {
    const letter = (chat.title || username(chat) || (isId(chat.chat) ? "" : chat.chat)).match(/[\p{L}\p{N}]/u);
    node.textContent = letter ? letter[0] : "#";
  }
  // The letter stays underneath until the photo arrives, then the photo fades in over it.
  if (chat.photo && tg) {
    photoUrl(chat.photo).then((url) => {
      if (!url) return;
      const img = el("img", { alt: "", src: url });
      img.addEventListener("load", () => img.classList.add("loaded"));
      node.append(img);
    });
  }
  return node;
}

// Where tapping a chat leads: its @username, else the invite or folder link it was added by.
// A chat known only by its ID has no link a person can open.
function chatLink(chat) {
  const name = username(chat);
  if (name) return "https://t.me/" + name.slice(1);
  if (isLink(chat.chat)) return chat.chat.replace(/^(https?:\/\/)?/i, "https://");
  return null;
}

function chatRow(chat, inFolder, count) {
  const status = chat.status === "expanded" ? "folder · " + (count === 1 ? "1 chat" : count + " chats") : null;
  const subtitle = el("div", { className: "row-subtitle" },
    el("span", { className: chat.status }, status || STATUS[chat.status] || chat.status));
  if (chat.title && username(chat)) subtitle.append(" · " + username(chat));
  const link = chatLink(chat);
  const row = el(link ? "a" : "div", { className: "row chat" + (inFolder ? " in-folder" : "") },
    avatar(chat),
    el("div", { className: "row-main" }, el("div", { className: "row-title" }, chatName(chat)), subtitle));
  if (link) {
    row.href = link;
    // The Mini App stays open behind the chat, so the user comes back to the list.
    row.addEventListener("click", (event) => {
      event.preventDefault();
      haptic("light");
      if (tg && tg.openTelegramLink) tg.openTelegramLink(link);
      else window.location.href = link;
    });
  }
  return row;
}

function subscription(sub) {
  const facts = el("dl", { className: "facts" }, el("dt", {}, "Who"), el("dd", {}, sub.author));
  if (sub.author_not) facts.append(el("dt", {}, "Skip"), el("dd", {}, sub.author_not));
  const chats = sub.chats.filter((chat) => chat.status !== "expanded").length;
  const kind = "Subscription · " + (chats === 1 ? "1 chat" : chats + " chats");
  const section = el("div", { className: "section" },
    el("div", { className: "details" },
      el("div", { className: "details-main" },
        el("div", { className: "kind" }, kind),
        el("div", { className: "query" }, sub.query),
        facts)));
  // Chats from a folder go under the folder's row; the other chats come first.
  const folders = new Set(sub.chats.filter((chat) => chat.status === "expanded").map((chat) => chat.chat));
  const inFolder = (chat) => chat.status !== "expanded" && folders.has(chat.folder);
  for (const chat of sub.chats) if (chat.status !== "expanded" && !inFolder(chat)) section.append(chatRow(chat));
  for (const folder of sub.chats) {
    if (folder.status !== "expanded") continue;
    const children = sub.chats.filter((chat) => inFolder(chat) && chat.folder === folder.chat);
    section.append(chatRow(folder, false, children.length));
    for (const chat of children) section.append(chatRow(chat, true));
  }
  return section;
}

function hero(iconName, title, text, quiet) {
  return el("div", { className: "hero" + (quiet ? " quiet" : "") },
    el("div", { className: "hero-icon" }, icon(iconName)),
    el("h1", {}, title),
    el("p", {}, text));
}

function openBot(link) {
  haptic("light");
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(link);
    tg.close();
  } else {
    window.location.href = link;
  }
}

function blockedAlert(botLink) {
  const action = el("a", { className: "row action", href: botLink },
    el("div", { className: "row-main" }, "Open the bot"),
    el("div", { className: "chevron" }, icon("chevron")));
  action.addEventListener("click", (event) => {
    event.preventDefault();
    openBot(botLink);
  });
  return el("div", { className: "section alert" },
    el("div", { className: "row" },
      el("div", { className: "alert-icon" }, icon("alert")),
      el("div", { className: "row-main" },
        el("div", { className: "row-title" }, "The bot cannot message you"),
        el("div", { className: "row-subtitle" },
          "You get no listings until you open the bot and press Start or Unblock."))),
    action);
}

function render(data) {
  const root = document.getElementById("root");
  root.replaceChildren();
  const subs = data.subscriptions;
  const blocked = data.notifications_blocked;
  // The warning goes above the list: nothing there works until the bot can write.
  if (subs.length === 0) {
    if (blocked) root.append(blockedAlert(data.bot_link));
    const empty = hero("inbox", "No subscriptions yet",
      "Tap “Add subscription” and tell the bot what to look for and in which chats.");
    root.append(blocked ? empty : el("div", { className: "centered" }, empty));
    return;
  }
  const top = hero("bell", subs.length === 1 ? "1 subscription" : subs.length + " subscriptions",
    "Barabot reads these chats and sends you the listings that match.");
  root.append(top);
  if (blocked) root.append(blockedAlert(data.bot_link));
  for (const sub of subs) root.append(subscription(sub));
  root.append(el("div", { className: "section-footer" },
    "Matching listings arrive in your chat with the bot."));
  collapse(top);
}

// Like a Telegram profile: the icon shrinks and fades as it scrolls away, the title rises with the page,
// sticks in the top bar and shrinks to a bar title on the way. The title's position is left to
// position: sticky, because a scroll handler runs a frame behind the scroll and makes it jitter.
// The handler only sets scale and opacity from positions measured once per layout.
function collapse(heroNode) {
  heroNode.classList.add("collapsing");
  const heroIcon = heroNode.querySelector(".hero-icon");
  const title = heroNode.querySelector("h1");
  const text = heroNode.querySelector("p");
  const bar = el("div", { className: "topbar" });
  document.body.append(bar);
  let m = null;

  function measure() {
    const y = window.scrollY;
    const top = (node) => node.getBoundingClientRect().top + y;
    title.style.position = "static";
    const titleTop = top(title);
    title.style.position = "";
    const rowHeight = parseFloat(getComputedStyle(bar).getPropertyValue("--topbar")) || 44;
    const compactScale = 17 / parseFloat(getComputedStyle(title).fontSize);
    const stickyTop = bar.offsetHeight - rowHeight + (rowHeight - title.offsetHeight * compactScale) / 2;
    title.style.top = stickyTop + "px";
    m = {
      compactScale,
      iconEnd: top(heroIcon) + heroIcon.offsetHeight * 0.8,
      textEnd: Math.max(1, top(text) - stickyTop),
      titleDistance: Math.max(1, titleTop - stickyTop),
    };
    update();
  }

  function update() {
    const y = Math.max(0, window.scrollY);
    const clamp = (v) => Math.min(1, Math.max(0, v));
    const fade = clamp(y / m.iconEnd);
    heroIcon.style.transform = "scale(" + (1 - fade) + ")";
    heroIcon.style.opacity = 1 - fade;
    text.style.opacity = 1 - clamp(y / m.textEnd);
    const progress = clamp(y / m.titleDistance);
    title.style.transform = "scale(" + (1 + (m.compactScale - 1) * progress) + ")";
    title.style.cursor = progress > 0.5 ? "pointer" : "";
    bar.style.opacity = progress;
  }

  let queued = false;
  window.addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }, { passive: true });
  window.addEventListener("resize", measure);
  if (tg) tg.onEvent("viewportChanged", (event) => { if (!event || event.isStateStable) measure(); });
  title.addEventListener("click", () => {
    if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: "smooth" });
  });
  measure();
}

function fail(message) {
  document.getElementById("root").replaceChildren(
    el("div", { className: "state" }, hero("bell", "Barabot", message, true)));
}

// Match Telegram's header, background and bottom bar to the page.
function paintChrome() {
  if (!tg) return;
  const at = (v) => !tg.isVersionAtLeast || tg.isVersionAtLeast(v);
  try {
    if (at("6.1")) {
      tg.setHeaderColor("secondary_bg_color");
      tg.setBackgroundColor("secondary_bg_color");
    }
    if (at("7.10")) tg.setBottomBarColor("secondary_bg_color");
  } catch (e) { /* older clients keep their own colours */ }
}

// Subscriptions are added in the chat with the bot, so the button leads there.
function addButton(botLink) {
  const button = el("button", { type: "button", textContent: "Add subscription" });
  button.addEventListener("click", () => {
    haptic("medium");
    tg.openTelegramLink(botLink);
    tg.close();
  });
  document.body.append(el("div", { className: "bottombar" }, button));
}

async function load() {
  tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) {
    tg = null;
    return fail("Open this page from the bot in Telegram.");
  }
  if (tg.platform === "android" || tg.platform === "android_x") document.documentElement.classList.add("android");
  tg.ready();
  tg.expand();
  paintChrome();
  tg.onEvent("themeChanged", paintChrome);
  try {
    const response = await fetch("api/subscriptions", { headers: { Authorization: "tma " + tg.initData } });
    const data = await response.json();
    if (!response.ok) return fail(data.error || "Something went wrong. Try again later.");
    render(data);
    addButton(data.bot_link);
  } catch (e) {
    fail("Barabot is not reachable. Try again in a minute.");
  }
}

load();
</script>
</body>
</html>
